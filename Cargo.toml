[workspace]
members = ["crates/domain", "crates/storage", "apps/tastellar/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "form", "rustls"] }
flate2 = "1.1.10"
quick-xml = "0.42.0"

[profile.release]
strip = "symbols"
